name: Deploy Youtyers to GitHub Pages (Cobalt smoke test included)

on:
  push:
    branches: [ 'arena/9c3ca5c9-youtyers' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke test Cobalt API (is the download endpoint alive?)
        id: cobalt
        continue-on-error: true
        env:
          COBALT_API: https://youtyers-528be.containers.snapdeploy.app/
        run: |
          set +e
          curl -fsS --max-time 20 -D /tmp/headers.txt "$COBALT_API" -o /tmp/info.json
          GET_CODE=$?
          ACAO=$(grep -i 'access-control-allow-origin' /tmp/headers.txt | tr -d '\r' | paste -sd ' ' -)
          POST_CODE=$(curl -sS --max-time 30 -X POST "$COBALT_API" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://example.com' \
            -d '{"url":"https://invalid.example/video","videoQuality":"720"}' \
            -o /tmp/post.json -w '%{http_code}')
          VERSION=$(python3 -c "import json;print(json.load(open('/tmp/info.json'))['cobalt']['version'])" 2>/dev/null || echo '?')
          SERVICES=$(python3 -c "import json;print(len(json.load(open('/tmp/info.json'))['cobalt']['services']))" 2>/dev/null || echo '?')
          PSTATUS=$(python3 -c "import json;print(json.load(open('/tmp/post.json')).get('status'))" 2>/dev/null || echo '?')
          PCODE=$(python3 -c "import json;print((json.load(open('/tmp/post.json')).get('error') or {}).get('code'))" 2>/dev/null || echo '?')
          echo "::notice title=Cobalt smoke test::GET / = HTTP $GET_CODE | version $VERSION | $SERVICES services | ACAO: ${ACAO:-none} | POST / = HTTP $POST_CODE, status=$PSTATUS, code=$PCODE"
          echo "## Cobalt API smoke test" > /tmp/summary.md
          echo "" >> /tmp/summary.md
          echo "| Check | Result |" >> /tmp/summary.md
          echo "| --- | --- |" >> /tmp/summary.md
          echo "| GET / instance info | HTTP $GET_CODE (v$VERSION, $SERVICES services) |" >> /tmp/summary.md
          echo "| ACAO / CORS header | ${ACAO:-none} |" >> /tmp/summary.md
          echo "| POST / processing | HTTP $POST_CODE, status **$PSTATUS**, code $PCODE |" >> /tmp/summary.md
          echo "" >> /tmp/summary.md
          echo "A JSON Cobalt response on POST / means the download pipeline is reachable." >> /tmp/summary.md
          cat /tmp/summary.md
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: End-to-end download probes (multiple services)
        id: dlprobe
        continue-on-error: true
        env:
          COBALT_API: https://youtyers-528be.containers.snapdeploy.app/
        run: |
          set +e
          probe () {
            local label="$1" body="$2"
            local code
            code=$(curl -sS --max-time 60 -X POST "$COBALT_API" \
              -H 'Accept: application/json' -H 'Content-Type: application/json' \
              -d "$body" -o /tmp/probe.json -w '%{http_code}')
            local parsed fileurl bytes
            parsed=$(python3 -c "
          import json
          try:
              d=json.load(open('/tmp/probe.json'))
              print(d.get('status'), '|', (d.get('error') or {}).get('code','-'), '|', d.get('filename','-'))
          except Exception as e: print('parse-error |',e,'| -')
          ")
            fileurl=$(python3 -c "
          import json
          try: print(json.load(open('/tmp/probe.json')).get('url') or '')
          except Exception: print('')
          ")
            bytes='-'
            if [ -n "$fileurl" ]; then
              bytes=$(curl -sS -L --max-time 45 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36' \
                -e 'https://vimeo.com/' -H 'Accept: */*' -r 0-2047 -o /tmp/chunk.bin \
                -w 'HTTP %{http_code}, %{size_download} bytes' "$fileurl" 2>/dev/null || echo 'stream failed')
            fi
            echo "::notice title=Download probe: $label::HTTP $code :: $parsed :: file bytes: $bytes"
          }
          probe "YouTube 360p h264"  '{"url":"https://www.youtube.com/watch?v=jNQXAC9IVRw","videoQuality":"360","downloadMode":"mute","youtubeVideoCodec":"h264"}'
          probe "YouTube 144p vp9 proxy" '{"url":"https://www.youtube.com/watch?v=dQw4w9WgXcQ","videoQuality":"144","youtubeVideoCodec":"vp9","alwaysProxy":true}'
          probe "Vimeo"            '{"url":"https://vimeo.com/76979871","videoQuality":"360"}'
          probe "Vimeo via cobalt tunnel" '{"url":"https://vimeo.com/76979871","videoQuality":"360","alwaysProxy":true}'
          probe "SoundCloud audio" '{"url":"https://soundcloud.com/odesza/say-my-name-feat-zyra","downloadMode":"audio","audioFormat":"mp3"}'
          probe "Dailymotion"      '{"url":"https://www.dailymotion.com/video/x7tgah0","videoQuality":"360"}'
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Real download probes: see the run annotations for per-service results." >> "$GITHUB_STEP_SUMMARY"

      - name: Build static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
          test -s _site/index.html
          echo "::notice title=Build::Site built: $(wc -c < _site/index.html) bytes"

      - name: Ensure GitHub Pages is enabled
        id: enable
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          GET=$(curl -sS -o /tmp/pages_get.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPO/pages")
          echo "::notice title=Pages GET::HTTP $GET"
          if [ "$GET" != "200" ]; then
            CREATE=$(curl -sS -o /tmp/pages_create.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPO/pages" \
              -d '{"build_type":"workflow"}')
            echo "::notice title=Pages CREATE::HTTP $CREATE - $(head -c 220 /tmp/pages_create.json | tr '\n' ' ')"
            GET=$(curl -sS -o /tmp/pages_get.json -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$REPO/pages")
          fi
          echo "pages_status=$GET" >> "$GITHUB_OUTPUT"
          if [ "$GET" = "200" ]; then
            echo "::notice title=Pages::Enabled - deploying now"
          else
            echo "::warning title=Pages blocked::Repo Settings > Pages > Build and deployment > Source = GitHub Actions, then re-run this workflow."
          fi

      - name: Setup Pages
        if: steps.enable.outputs.pages_status == '200'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.enable.outputs.pages_status == '200'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.enable.outputs.pages_status == '200'
        uses: actions/deploy-pages@v4
