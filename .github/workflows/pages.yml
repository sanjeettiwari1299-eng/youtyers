name: Deploy Youtyers to GitHub Pages (Cobalt smoke test included)

on:
  push:
    branches: [ 'arena/9c3ca5c9-youtyers' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke test Cobalt API (is download endpoint alive?)
        id: cobalt
        continue-on-error: true
        env:
          COBALT_API: https://youtyers-528be.containers.snapdeploy.app/
        run: |
          set +e
          echo "===== GET / : instance info + response headers ====="
          curl -fsS --max-time 20 -D /tmp/headers.txt "$COBALT_API" -o /tmp/info.json
          GET_CODE=$?
          cat /tmp/info.json
          echo
          echo "===== CORS (browser needs access-control-allow-origin) ====="
          grep -i 'access-control-allow-origin' /tmp/headers.txt || echo "(ACAO header not present)"
          echo "===== POST / : does processing endpoint return JSON? ====="
          POST_CODE=$(curl -sS --max-time 30 -X POST "$COBALT_API" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://example.com' \
            -d '{"url":"https://invalid.example/video","videoQuality":"720"}' \
            -o /tmp/post.json -w '%{http_code}')
          cat /tmp/post.json
          echo
          echo "GET_HTTP=$GET_CODE POST_HTTP=$POST_CODE" > /tmp/codes.txt
          {
            echo "## 🔌 Cobalt API smoke test"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| GET / (instance info) | HTTP $GET_CODE |"
            echo "| POST / (processing endpoint) | HTTP $POST_CODE |"
            echo "| ACAO header | $(grep -i 'access-control-allow-origin' /tmp/headers.txt | tr -d '\r' | paste -sd ' ' -) |"
            python3 - <<'PY'
          import json
          try:
              i=json.load(open('/tmp/info.json'))
              print("| Cobalt version | %s |" % i['cobalt']['version'])
              print("| Supported services | %d |" % len(i['cobalt']['services']))
          except Exception as e:
              print("| Instance info | parse failed: %s |" % e)
          try:
              p=json.load(open('/tmp/post.json'))
              print("| POST JSON status | %s |" % p.get('status'))
              print("| POST error code | %s |" % (p.get('error') or {}).get('code','-'))
          except Exception as e:
              print("| POST JSON | parse failed: %s |" % e)
          PY
            echo ""
            echo "POST endpoint returns valid Cobalt JSON ⇒ downloads are wired up correctly."
            echo "Browser calls need the ACAO header above; if missing, set a Relay URL in site Settings."
          } > /tmp/summary.md
          cat /tmp/summary.md
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
          test -s _site/index.html
          echo "site bytes: $(wc -c < _site/index.html)"

      - name: Setup Pages (enable Pages if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
