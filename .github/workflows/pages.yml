name: Deploy Youtyers to GitHub Pages (Cobalt smoke test included)

on:
  push:
    branches: [ 'arena/9c3ca5c9-youtyers' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke test Cobalt API (is the download endpoint alive?)
        id: cobalt
        continue-on-error: true
        env:
          COBALT_API: https://youtyers-528be.containers.snapdeploy.app/
        run: |
          set +e
          curl -fsS --max-time 20 -D /tmp/headers.txt "$COBALT_API" -o /tmp/info.json
          GET_CODE=$?
          ACAO=$(grep -i 'access-control-allow-origin' /tmp/headers.txt | tr -d '\r' | paste -sd ' ' -)
          POST_CODE=$(curl -sS --max-time 30 -X POST "$COBALT_API" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://example.com' \
            -d '{"url":"https://invalid.example/video","videoQuality":"720"}' \
            -o /tmp/post.json -w '%{http_code}')
          VERSION=$(python3 -c "import json;print(json.load(open('/tmp/info.json'))['cobalt']['version'])" 2>/dev/null || echo '?')
          SERVICES=$(python3 -c "import json;print(len(json.load(open('/tmp/info.json'))['cobalt']['services']))" 2>/dev/null || echo '?')
          PSTATUS=$(python3 -c "import json;print(json.load(open('/tmp/post.json')).get('status'))" 2>/dev/null || echo '?')
          PCODE=$(python3 -c "import json;print((json.load(open('/tmp/post.json')).get('error') or {}).get('code'))" 2>/dev/null || echo '?')
          echo "::notice title=Cobalt smoke test::GET / = HTTP $GET_CODE | version $VERSION | $SERVICES services | ACAO: ${ACAO:-none} | POST / = HTTP $POST_CODE, status=$PSTATUS, code=$PCODE"
          echo "## Cobalt API smoke test" > /tmp/summary.md
          echo "" >> /tmp/summary.md
          echo "| Check | Result |" >> /tmp/summary.md
          echo "| --- | --- |" >> /tmp/summary.md
          echo "| GET / instance info | HTTP $GET_CODE (v$VERSION, $SERVICES services) |" >> /tmp/summary.md
          echo "| ACAO / CORS header | ${ACAO:-none} |" >> /tmp/summary.md
          echo "| POST / processing | HTTP $POST_CODE, status **$PSTATUS**, code $PCODE |" >> /tmp/summary.md
          echo "" >> /tmp/summary.md
          echo "A JSON Cobalt response on POST / means the download pipeline is reachable." >> /tmp/summary.md
          cat /tmp/summary.md
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: End-to-end download probe (real public video)
        id: dlprobe
        continue-on-error: true
        env:
          COBALT_API: https://youtyers-528be.containers.snapdeploy.app/
        run: |
          set +e
          CODE=$(curl -sS --max-time 90 -X POST "$COBALT_API" \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            -d '{"url":"https://www.youtube.com/watch?v=jNQXAC9IVRw","videoQuality":"360","downloadMode":"mute","youtubeVideoCodec":"h264"}' \
            -o /tmp/dl.json -w '%{http_code}')
          python3 - <<'PY' > /tmp/dlout.txt
          import json
          try:
              d = json.load(open('/tmp/dl.json'))
              s = d.get('status')
              print(s or 'unknown')
              print(d.get('url') or '')
              print(d.get('filename') or '')
              print((d.get('error') or {}).get('code') or '')
          except Exception as e:
              print('parse-error'); print(''); print(''); print(str(e))
          PY
          STATUS=$(sed -n '1p' /tmp/dlout.txt)
          DLURL=$(sed -n '2p' /tmp/dlout.txt)
          FNAME=$(sed -n '3p' /tmp/dlout.txt)
          ERR=$(sed -n '4p' /tmp/dlout.txt)
          BYTES=''
          if [ -n "$DLURL" ]; then
            BYTES=$(curl -sS -L --max-time 45 -r 0-2047 -o /tmp/chunk.bin -w 'HTTP %{http_code}, %{size_download} bytes' "$DLURL" 2>/dev/null)
          fi
          echo "::notice title=Real download probe::POST HTTP $CODE | status=$STATUS | filename=${FNAME:-none} | error=${ERR:-none} | file stream: ${BYTES:-not fetched}"
          {
            echo ""
            echo "### Real download probe (19s public YouTube clip, 360p mute)"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| POST / | HTTP $CODE, status **$STATUS** |"
            echo "| Filename | ${FNAME:-none} |"
            echo "| File stream (first 2 KB) | ${BYTES:-not fetched} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
          test -s _site/index.html
          echo "::notice title=Build::Site built: $(wc -c < _site/index.html) bytes"

      - name: Ensure GitHub Pages is enabled
        id: enable
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          GET=$(curl -sS -o /tmp/pages_get.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPO/pages")
          echo "::notice title=Pages GET::HTTP $GET"
          if [ "$GET" != "200" ]; then
            CREATE=$(curl -sS -o /tmp/pages_create.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPO/pages" \
              -d '{"build_type":"workflow"}')
            echo "::notice title=Pages CREATE::HTTP $CREATE - $(head -c 220 /tmp/pages_create.json | tr '\n' ' ')"
            GET=$(curl -sS -o /tmp/pages_get.json -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$REPO/pages")
          fi
          echo "pages_status=$GET" >> "$GITHUB_OUTPUT"
          if [ "$GET" = "200" ]; then
            echo "::notice title=Pages::Enabled - deploying now"
          else
            echo "::warning title=Pages blocked::Repo Settings > Pages > Build and deployment > Source = GitHub Actions, then re-run this workflow."
          fi

      - name: Setup Pages
        if: steps.enable.outputs.pages_status == '200'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.enable.outputs.pages_status == '200'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.enable.outputs.pages_status == '200'
        uses: actions/deploy-pages@v4
